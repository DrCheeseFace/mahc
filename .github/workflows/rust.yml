name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run fmt check 
      run: cargo fmt --check 
    - name: Run clippy check
      run: cargo clippy -- -A clippy::too_many_arguments
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
